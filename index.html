<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Static Application</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
        }

        .container {
            margin: 80px auto;
            background: white;
            width: 500px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Static Website</h1>
    </header>

    <div class="container">

        <h2>Welcome to My Application 🚀</h2>

        <p>
            This is a simple static HTML application.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Application is working successfully! 🎉";
        }
    </script>

</body>
</html>
